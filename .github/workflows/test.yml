name: Tests

# Runs the full test suite on every push/PR to main -- see
# docs/PHASE_0_AUDIT.md Phase 5: nothing was catching a regression
# automatically before this, despite Phases 1-4 building real test
# coverage specifically to guard against real bugs found in this project.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Phase 14 (master directive numbering): tests/conftest.py's
    # @requires_redis-marked tests need a real, live Redis -- a service
    # container, not installed via apt like Tesseract/LibreOffice above,
    # since GitHub Actions ships this as a first-class feature for
    # exactly this case (no image build, no separate lifecycle
    # management -- it's up before the first step runs and torn down
    # with the job automatically).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Tesseract OCR, LibreOffice)
        # opencv-contrib-python needs libGL/libglib even headless on a
        # minimal Linux image -- a common gotcha on CI runners, not
        # optional here. libreoffice-writer/-calc/-impress (Phase 9,
        # master directive numbering) are what tests/
        # test_libreoffice_conversions.py and the Office/HTML/Markdown
        # tests in test_api.py need to actually run here instead of
        # perpetually skipping -- same targeted-packages choice as the
        # Dockerfile, not the full libreoffice metapackage.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr libgl1 libglib2.0-0 \
            libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Install Playwright browser
        # tests/test_frontend.py drives a real headless browser against the
        # actual frontend -- --with-deps pulls the OS libraries Chromium
        # needs that aren't already covered by the Tesseract step above.
        run: playwright install chromium --with-deps

      - name: Run tests
        run: |
          set -o pipefail
          pytest tests/ -v 2>&1 | tee pytest_output.txt

      # Debugging aid added while chasing a real, CI-only Phase 14
      # failure (master directive numbering: Job Queue & Real-Time
      # Processing) that a truncated inline step log kept hiding the
      # actual cause of. The inline log view truncates large steps and
      # downloading the full job log requires repo admin/write access,
      # which this session doesn't have -- an uploaded artifact has a
      # separate, more permissive access model and can be fetched
      # programmatically regardless. Uploads on every run, pass or
      # fail (if: always()), not just on failure, so this stays useful
      # without needing a special-cased conditional.
      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_output.txt
          retention-days: 5

  docker:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    needs: test
    # Phase 20 (master directive numbering): Production Release
    # Engineering -- the "CD" half of CI/CD, `needs: test` so a broken
    # test suite can never reach the registry. Builds on every push AND
    # every PR (a real, executed build is real, useful validation that
    # the Dockerfile itself still works, not just that Python imports
    # cleanly -- confirmed by this exact job running, build-only, on
    # this phase's own PR before it could push anything) but only ever
    # pushes to ghcr.io once merged to main: a PR run (including one
    # from a fork, which wouldn't have GITHUB_TOKEN's package-write
    # permission at all) never has `push: true` below.
    #
    # GitHub Container Registry, not Docker Hub -- needs no new secret
    # at all (GITHUB_TOKEN, already present on every run, is enough),
    # unlike Docker Hub which would need separate account credentials
    # this repo doesn't have configured. The one real registry choice
    # this phase made, and the only one with a genuinely free, working
    # default -- not a coin flip.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute a registry-valid (lowercase) image name
        # ghcr.io (like every Docker registry) rejects uppercase
        # repository names -- this repo's own name has uppercase
        # letters, so github.repository ("owner/Name") can't be used
        # directly as an image reference.
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (and push, only on a real merge to main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
