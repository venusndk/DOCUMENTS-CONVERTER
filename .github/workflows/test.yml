name: Tests

# Runs the full test suite on every push/PR to main -- see
# docs/PHASE_0_AUDIT.md Phase 5: nothing was catching a regression
# automatically before this, despite Phases 1-4 building real test
# coverage specifically to guard against real bugs found in this project.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Phase 14 (master directive numbering): tests/conftest.py's
    # @requires_redis-marked tests need a real, live Redis -- a service
    # container, not installed via apt like Tesseract/LibreOffice above,
    # since GitHub Actions ships this as a first-class feature for
    # exactly this case (no image build, no separate lifecycle
    # management -- it's up before the first step runs and torn down
    # with the job automatically).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Tesseract OCR, LibreOffice)
        # opencv-contrib-python needs libGL/libglib even headless on a
        # minimal Linux image -- a common gotcha on CI runners, not
        # optional here. libreoffice-writer/-calc/-impress (Phase 9,
        # master directive numbering) are what tests/
        # test_libreoffice_conversions.py and the Office/HTML/Markdown
        # tests in test_api.py need to actually run here instead of
        # perpetually skipping -- same targeted-packages choice as the
        # Dockerfile, not the full libreoffice metapackage.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr libgl1 libglib2.0-0 \
            libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Install Playwright browser
        # tests/test_frontend.py drives a real headless browser against the
        # actual frontend -- --with-deps pulls the OS libraries Chromium
        # needs that aren't already covered by the Tesseract step above.
        run: playwright install chromium --with-deps

      - name: Run tests
        run: pytest tests/ -v
