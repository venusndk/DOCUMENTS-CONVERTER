# Phase 14 (master directive numbering): Job Queue & Real-Time
# Processing. The first point in this project where "docker run" one
# image isn't enough to demonstrate the real thing -- a real job queue
# needs a real broker (redis) and a real, separate worker process
# (worker), not just the api container that was sufficient through
# Phase 13.
#
# Two things every other service here depends on, worth stating once:
# - Postgres, not the default local SQLite: two separate processes
#   (api, worker) reading/writing the same JobRecord/BatchRecord rows
#   is exactly the concurrent-multi-process case Postgres is built for
#   and SQLite's file-locking is not, even in WAL mode, once that file
#   is reached from two different containers over a shared volume
#   rather than two threads in one process. This project has supported
#   both backends since Phase 1 completion -- this is the deployment
#   shape that was always the real reason for that, not SQLite's.
# - The `work_data` volume: api and worker are separate containers with
#   separate filesystems. A job's input/output files have to live
#   somewhere both containers can actually see -- see config.WORK_DIR_ROOT
#   and storage.py's docstrings for the full story.
#
# Usage:
#   docker compose up --build
#   curl http://localhost:8000/health
#
# Scale worker capacity independently of the api process:
#   docker compose up --build --scale worker=3

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docconv
      POSTGRES_PASSWORD: docconv
      POSTGRES_DB: docconv
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docconv"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://docconv:docconv@postgres:5432/docconv
      REDIS_URL: redis://redis:6379/0
      WORK_DIR_ROOT: /app/work
      # Phase 16 (master directive numbering): AI Document Intelligence
      # is opt-in -- unset by default (${VAR:-} passes an empty string,
      # which config.py's `or None` treats the same as unset), same as
      # this file never sets API_KEYS. Only the api process needs this:
      # every /api/v1/ai/* endpoint is synchronous, nothing runs in
      # `worker`. Deliberately NOT also passing AI_MODEL/AI_MAX_TEXT_CHARS
      # through this way -- unlike GEMINI_API_KEY, both of those use a
      # real non-empty default in config.py (os.environ.get(name,
      # default) with no `or` fallback), so an unset-on-host `${VAR:-}`
      # would set the container's env var to "" instead of leaving it
      # absent, silently overriding that default with an empty/invalid
      # value. Set it on the host shell before `docker compose up`:
      #   GEMINI_API_KEY=... docker compose up --build
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - work_data:/app/work
    ports:
      # API_PORT lets a host with 8000 already taken by something else
      # override the published port without editing this file, e.g.
      #   API_PORT=8001 docker compose up --build
      - "${API_PORT:-8000}:8000"

  worker:
    build: .
    command: ["python", "-m", "documents_converter.api.worker_main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://docconv:docconv@postgres:5432/docconv
      REDIS_URL: redis://redis:6379/0
      WORK_DIR_ROOT: /app/work
    volumes:
      - work_data:/app/work

volumes:
  pg_data:
  work_data:
